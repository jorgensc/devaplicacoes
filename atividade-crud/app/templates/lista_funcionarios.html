<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Funcionários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            Lista de Funcionários
        </div>

        <div class="card-body">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for f in object_list %}
                    <tr>
                        <td>{{ f.nome }}</td>
                        <td>{{ f.email }}</td>
                        <td>
                            <a href="/app/form_funcionario/{{ f.id }}/" class="btn btn-warning btn-sm">Editar</a>
                            <a href="/app/remover_funcionario/{{ f.id }}/" class="btn btn-danger btn-sm">Excluir</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <a href="/app/form_funcionario/" class="btn btn-primary">Novo Funcionário</a>
        </div>
    </div>
</div>
</body>
</html>
